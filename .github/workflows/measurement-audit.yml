name: Serphic measurement audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Measure published page
        run: |
          cat > audit.cjs <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = 'https://mariopablicoseo.github.io/serphic-preview/';
          const widths = [1440,1280,1024,430,390];
          const report = { url: base, generatedAt: new Date().toISOString(), viewports: {} };

          const pick = (st) => ({
            fontSize: st.fontSize,
            lineHeight: st.lineHeight,
            marginTop: st.marginTop,
            marginBottom: st.marginBottom,
            padding: st.padding,
            paddingTop: st.paddingTop,
            paddingRight: st.paddingRight,
            paddingBottom: st.paddingBottom,
            paddingLeft: st.paddingLeft,
            gap: st.gap,
            borderTopWidth: st.borderTopWidth,
            borderRightWidth: st.borderRightWidth,
            borderBottomWidth: st.borderBottomWidth,
            borderLeftWidth: st.borderLeftWidth,
            borderRadius: st.borderRadius,
            minHeight: st.minHeight,
            height: st.height,
            maxWidth: st.maxWidth,
          });

          (async()=>{
            const browser = await chromium.launch({headless:true});
            for (const width of widths) {
              const page = await browser.newPage({viewport:{width,height:1000}});
              await page.goto(base + '?measurement=' + Date.now() + '-' + width,{waitUntil:'networkidle',timeout:45000});
              await page.waitForTimeout(900);
              const data = await page.evaluate(() => {
                const q = s => document.querySelector(s);
                const qa = s => [...document.querySelectorAll(s)];
                const style = s => { const el=q(s); return el ? getComputedStyle(el) : null; };
                const rect = s => { const el=q(s); if(!el)return null; const r=el.getBoundingClientRect(); return {left:r.left,right:r.right,width:r.width,top:r.top,height:r.height}; };
                const pick = st => st ? ({
                  fontSize:st.fontSize,lineHeight:st.lineHeight,marginTop:st.marginTop,marginBottom:st.marginBottom,
                  padding:st.padding,paddingTop:st.paddingTop,paddingRight:st.paddingRight,paddingBottom:st.paddingBottom,paddingLeft:st.paddingLeft,
                  gap:st.gap,borderTopWidth:st.borderTopWidth,borderRightWidth:st.borderRightWidth,borderBottomWidth:st.borderBottomWidth,borderLeftWidth:st.borderLeftWidth,
                  borderRadius:st.borderRadius,minHeight:st.minHeight,height:st.height,maxWidth:st.maxWidth
                }) : null;
                const h2s = qa('main h2').map(el => ({text:el.textContent.trim(),...pick(getComputedStyle(el)),rect:(()=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width}})()}));
                const headers = qa('.section-header,#system header,#industries header,#review header,#process header,#pricing header').map(el=>({className:el.className,...pick(getComputedStyle(el)),rect:(()=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width}})()}));
                const sectionSelectors=['#system','#industries','#review','#process','#pricing','#about','.faq-section','.final-section'];
                const sections = {};
                for(const s of sectionSelectors){ const el=q(s); if(el) sections[s]={...pick(getComputedStyle(el)),rect}; }
                const alignmentSelectors=['.hero-copy','#results .proof-intro','#system .section-header','#system .system-grid','#industries .section-header','#industries .workspace','#review .section-header','#review .workspace','#process .section-header','#process .sequence-list','#pricing .section-header','#pricing .price-grid','#about .founder-grid','.faq-layout','.final-card'];
                const alignments={}; for(const s of alignmentSelectors) alignments[s]=rect(s);
                return {
                  viewport:{width:innerWidth,scrollWidth:document.documentElement.scrollWidth},
                  container:rect('.container'),
                  body:pick(getComputedStyle(document.body)),
                  heroH1:pick(style('.hero h1')),
                  heroLead:pick(style('.hero .lead')),
                  kicker:pick(style('.kicker,.section-kicker')),
                  h2s,headers,sections,alignments,
                  primaryButton:pick(style('.button.primary')),
                  nav:pick(style('.navbar')),
                  navLink:pick(style('.nav-links a')),
                  workspace:pick(style('.workspace')),
                  workspacePanel:pick(style('.workspace-copy')),
                  focusTab:pick(style('#industries [data-focus]')),
                  reviewTab:pick(style('#review [data-review]')),
                  metricShell:pick(style('#results .metrics-shell')),
                  metricCard:pick(style('#results .metric')),
                  systemGrid:pick(style('#system .system-grid')),
                  systemCard:pick(style('#system .system-card')),
                  illustrationWell:pick(style('#system .illustration-well')),
                  sequenceList:pick(style('#process .sequence-list')),
                  sequenceRow:pick(style('#process .sequence-row')),
                  priceGrid:pick(style('#pricing .price-grid')),
                  priceCard:pick(style('#pricing .price-card')),
                  founderGrid:pick(style('#about .founder-grid')),
                  profileCard:pick(style('#about .profile-card')),
                  founderWorkCard:pick(style('#about .founder-work-card')),
                  faqList:pick(style('.faq-list')),
                  faqRow:pick(style('.faq-list details')),
                  finalCard:pick(style('.final-card')),
                };
              });
              report.viewports[String(width)] = data;
              await page.screenshot({path:`audit-${width}.png`,fullPage:true});
              await page.close();
            }
            fs.writeFileSync('measurement-audit.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node audit.cjs
      - name: Upload measurement audit
        uses: actions/upload-artifact@v4
        with:
          name: serphic-measurement-audit
          path: |
            measurement-audit.json
            audit-1440.png
            audit-1280.png
            audit-1024.png
            audit-430.png
            audit-390.png
