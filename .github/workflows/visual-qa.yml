name: Serphic visual QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Run live preview QA
        run: |
          cat > qa.cjs <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const url = 'https://mariopablicoseo.github.io/serphic-preview/';
          const results = { url, assertions: [], consoleErrors: [], pageErrors: [], desktop: {}, mobile: {} };
          const add = (name, pass, actual, expected) => results.assertions.push({ name, pass, actual, expected });
          const lightColor = value => {
            const m = String(value).match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
            return !!m && Number(m[1]) >= 230 && Number(m[2]) >= 230 && Number(m[3]) >= 230;
          };

          async function inspect(page, label) {
            const data = await page.evaluate(() => {
              const one = s => document.querySelector(s);
              const all = s => [...document.querySelectorAll(s)];
              const cs = (s, pseudo) => {
                const el = typeof s === 'string' ? one(s) : s;
                if (!el) return null;
                const st = getComputedStyle(el, pseudo);
                return {
                  color: st.color,
                  backgroundColor: st.backgroundColor,
                  backgroundImage: st.backgroundImage,
                  borderColor: st.borderColor,
                  borderWidth: st.borderWidth,
                  borderRadius: st.borderRadius,
                  padding: st.padding,
                  gap: st.gap,
                  minHeight: st.minHeight,
                  height: st.height,
                  display: st.display,
                  content: st.content,
                  transform: st.transform,
                  boxShadow: st.boxShadow,
                  fontFamily: st.fontFamily,
                  fontSize: st.fontSize,
                };
              };
              return {
                title: document.title,
                viewport: { width: innerWidth, height: innerHeight, scrollWidth: document.documentElement.scrollWidth },
                headingColors: all('main h1,main h2,main h3,main h4').map(el => getComputedStyle(el).color),
                pricingCards: all('#pricing .price-card').length,
                pricingRows: all('#pricing .pricing-row').length,
                heroNodes: all('.network-node').length,
                heroNodeSvgs: all('.network-node svg').length,
                heroNetwork: cs('.hero-network'),
                reviewIconSvgs: all('#review-icon svg').length,
                workspaceCount: all('.workspace').length,
                workspace: cs('.workspace'),
                workspaceBefore: cs('.workspace','::before'),
                workspaceStage: cs('.workspace-stage'),
                workspacePanels: all('.workspace .workspace-copy, .workspace .workspace-visual').length,
                mapTransform: cs('.map-grid')?.transform,
                primaryButton: cs('.button.primary'),
                processRows: all('#process .sequence-row').length,
                founderCards: all('#about .profile-card,#about .founder-work-card').length,
                reviewTabs: all('#review [data-review]').length,
                focusTabs: all('#industries [data-focus]').length,
                systemCards: all('#system .system-card').length,
                systemCard: cs('#system .system-card'),
                illustrationWell: cs('#system .illustration-well'),
                systemSection: cs('#system'),
                proofMetrics: all('#results .metric').length,
                metricsShell: cs('#results .metrics-shell'),
                metricCard: cs('#results .metric'),
                faqItems: all('.faq-list details').length,
                faqList: cs('.faq-list'),
                faqDetail: cs('.faq-list details'),
                finalCard: cs('.final-card'),
                body: cs('body'),
                h1: cs('h1'),
              };
            });
            results[label] = data;
            return data;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1100 }, deviceScaleFactor: 1 });
            const page = await context.newPage();
            page.on('console', msg => { if (msg.type() === 'error') results.consoleErrors.push(msg.text()); });
            page.on('pageerror', err => results.pageErrors.push(String(err)));

            let ready = false;
            for (let i = 0; i < 30; i++) {
              await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 });
              await page.waitForTimeout(900);
              ready = await page.evaluate(() => {
                const finalCard = document.querySelector('.final-card');
                return document.querySelectorAll('#pricing .price-card').length === 3 &&
                  document.querySelectorAll('.network-node svg').length === 8 &&
                  finalCard && getComputedStyle(finalCard).borderRadius === '28px';
              });
              if (ready) break;
              await page.waitForTimeout(5000);
            }

            const desktop = await inspect(page, 'desktop');
            await page.screenshot({ path: 'serphic-desktop.png', fullPage: true });

            add('Latest parity layer deployed', ready, { pricingCards: desktop.pricingCards, heroNodeSvgs: desktop.heroNodeSvgs, finalRadius: desktop.finalCard?.borderRadius }, '3 pricing cards, 8 hero SVGs, 28px final CTA');
            add('Page title', desktop.title === 'SEO for Plumbing & HVAC Companies | Serphic', desktop.title, 'SEO for Plumbing & HVAC Companies | Serphic');
            add('No horizontal desktop overflow', desktop.viewport.scrollWidth <= desktop.viewport.width + 1, desktop.viewport, 'scrollWidth <= viewport width');
            add('All headings are light', desktop.headingColors.every(lightColor), [...new Set(desktop.headingColors)], 'all RGB channels >= 230');
            add('Three pricing cards', desktop.pricingCards === 3 && desktop.pricingRows === 0, {cards:desktop.pricingCards,rows:desktop.pricingRows}, '3 cards / 0 rows');
            add('Eight SVG hero icons', desktop.heroNodes === 8 && desktop.heroNodeSvgs === 8, {nodes:desktop.heroNodes,svgs:desktop.heroNodeSvgs}, '8 / 8');
            add('Hero illustration unboxed', desktop.heroNetwork?.borderWidth === '0px' && desktop.heroNetwork?.backgroundColor === 'rgba(0, 0, 0, 0)', desktop.heroNetwork, '0px border / transparent');
            add('Two real workspace shells', desktop.workspaceCount === 2, desktop.workspaceCount, 2);
            add('Workspace outer outline locked', desktop.workspace?.borderWidth === '1px' && desktop.workspace?.borderRadius === '18px' && desktop.workspace?.padding === '12px', desktop.workspace, '1px / 18px / 12px');
            add('No extra workspace pseudo-frame', desktop.workspaceBefore?.display === 'none' && desktop.workspaceStage?.borderWidth === '0px', {before:desktop.workspaceBefore,stage:desktop.workspaceStage}, 'pseudo none / stage border 0');
            add('Four real workspace panels', desktop.workspacePanels === 4, desktop.workspacePanels, 4);
            add('Maps grid straight', desktop.mapTransform === 'none' || desktop.mapTransform === 'matrix(1, 0, 0, 1, 0, 0)', desktop.mapTransform, 'none');
            add('Five 90-day rows', desktop.processRows === 5, desktop.processRows, 5);
            add('Two founder cards', desktop.founderCards === 2, desktop.founderCards, 2);
            add('Five review tabs', desktop.reviewTabs === 5, desktop.reviewTabs, 5);
            add('Review SVG icon restored', desktop.reviewIconSvgs >= 1, desktop.reviewIconSvgs, '>= 1');
            add('Two industry tabs', desktop.focusTabs === 2, desktop.focusTabs, 2);
            add('Three operating-system cards', desktop.systemCards === 3, desktop.systemCards, 3);
            add('Operating-system proportions', desktop.systemCard?.minHeight === '500px' && desktop.illustrationWell?.height === '230px', {card:desktop.systemCard,well:desktop.illustrationWell}, '500px card / 230px well');
            add('System section source background', desktop.systemSection?.backgroundColor === 'rgb(9, 12, 13)', desktop.systemSection?.backgroundColor, 'rgb(9, 12, 13)');
            add('Three proof metrics', desktop.proofMetrics === 3, desktop.proofMetrics, 3);
            add('Evidence shell uses card gaps', desktop.metricsShell?.padding === '10px' && desktop.metricsShell?.gap === '12px' && desktop.metricCard?.borderRadius === '14px', {shell:desktop.metricsShell,metric:desktop.metricCard}, '10px padding / 12px gap / 14px cards');
            add('Six FAQ rows', desktop.faqItems === 6, desktop.faqItems, 6);
            add('FAQ uses divider treatment', desktop.faqDetail?.borderRadius === '0px', desktop.faqDetail, '0px radius');
            add('Final CTA source treatment', desktop.finalCard?.borderRadius === '28px' && desktop.finalCard?.color === 'rgb(6, 16, 15)' && /linear-gradient/.test(desktop.finalCard?.backgroundImage || ''), desktop.finalCard, '28px bright source CTA with dark text');
            add('Plus Jakarta body font', /Plus Jakarta Sans/i.test(desktop.body?.fontFamily || ''), desktop.body?.fontFamily, 'Plus Jakarta Sans');
            add('Primary control locked', desktop.primaryButton?.borderRadius === '10px' && parseFloat(desktop.primaryButton?.height || '0') >= 40, desktop.primaryButton, '10px radius / >=40px');
            add('No page errors', results.pageErrors.length === 0, results.pageErrors, []);

            await page.setViewportSize({ width: 390, height: 844 });
            await page.reload({ waitUntil: 'networkidle' });
            await page.waitForTimeout(1000);
            const mobile = await inspect(page, 'mobile');
            await page.screenshot({ path: 'serphic-mobile.png', fullPage: true });
            add('No horizontal mobile overflow', mobile.viewport.scrollWidth <= mobile.viewport.width + 1, mobile.viewport, 'scrollWidth <= viewport width');
            add('Mobile retains three pricing cards', mobile.pricingCards === 3, mobile.pricingCards, 3);
            add('Mobile retains two workspaces', mobile.workspaceCount === 2, mobile.workspaceCount, 2);
            add('Mobile workspace padding 10px', mobile.workspace?.padding === '10px', mobile.workspace?.padding, '10px');
            add('Mobile final CTA source radius', mobile.finalCard?.borderRadius === '22px', mobile.finalCard?.borderRadius, '22px');

            fs.writeFileSync('qa-results.json', JSON.stringify(results, null, 2));
            console.log(JSON.stringify(results, null, 2));
            await browser.close();
            if (results.assertions.some(a => !a.pass)) process.exitCode = 1;
          })().catch(err => { console.error(err); process.exit(1); });
          EOF
          node qa.cjs

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serphic-visual-qa
          path: |
            serphic-desktop.png
            serphic-mobile.png
            qa-results.json
          if-no-files-found: warn
