name: Serphic visual QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: QA the published GitHub Pages preview
        run: |
          cat > qa.cjs <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const url = 'https://mariopablicoseo.github.io/serphic-preview/';
          const out = { url, checks: [], consoleErrors: [], pageErrors: [] };
          const add = (name, pass, actual, expected) => out.checks.push({name, pass, actual, expected});
          const light = c => {
            const m = String(c).match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
            return !!m && +m[1] >= 230 && +m[2] >= 230 && +m[3] >= 230;
          };
          const inspect = page => page.evaluate(() => {
            const q = s => document.querySelector(s);
            const qa = s => [...document.querySelectorAll(s)];
            const css = (s,p) => {
              const el = q(s); if(!el) return null; const x=getComputedStyle(el,p);
              return {color:x.color,backgroundColor:x.backgroundColor,backgroundImage:x.backgroundImage,borderWidth:x.borderWidth,borderRadius:x.borderRadius,padding:x.padding,gap:x.gap,height:x.height,minHeight:x.minHeight,display:x.display,content:x.content,transform:x.transform,fontFamily:x.fontFamily};
            };
            return {
              title:document.title,
              viewport:{width:innerWidth,scrollWidth:document.documentElement.scrollWidth},
              darkSurfaceHeadings:qa('main h1,main h2,main h3,main h4').filter(el=>!el.closest('.final-card')).map(el=>getComputedStyle(el).color),
              pricingCards:qa('#pricing .price-card').length, pricingRows:qa('#pricing .pricing-row').length,
              heroNodes:qa('.network-node').length, heroSvgs:qa('.network-node svg').length, hero:css('.hero-network'),
              workspaces:qa('.workspace').length, workspace:css('.workspace'), workspaceBefore:css('.workspace','::before'), stage:css('.workspace-stage'), panels:qa('.workspace .workspace-copy,.workspace .workspace-visual').length,
              mapTransform:css('.map-grid')?.transform,
              processRows:qa('#process .sequence-row').length, founderCards:qa('#about .profile-card,#about .founder-work-card').length,
              reviewTabs:qa('#review [data-review]').length, reviewIcon:qa('#review-icon svg').length, focusTabs:qa('#industries [data-focus]').length,
              systemCards:qa('#system .system-card').length, systemCard:css('#system .system-card'), well:css('#system .illustration-well'), system:css('#system'),
              metrics:qa('#results .metric').length, metricsShell:css('#results .metrics-shell'), metric:css('#results .metric'),
              faq:qa('.faq-list details').length, faqRow:css('.faq-list details'),
              finalCard:css('.final-card'), button:css('.button.primary'), body:css('body')
            };
          });
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            page.on('console',m=>{if(m.type()==='error')out.consoleErrors.push(m.text())});
            page.on('pageerror',e=>out.pageErrors.push(String(e)));
            let ready=false;
            for(let i=0;i<30;i++){
              await page.goto(url,{waitUntil:'networkidle',timeout:45000}); await page.waitForTimeout(700);
              ready=await page.evaluate(()=>getComputedStyle(document.querySelector('.final-card')).borderRadius==='28px'&&document.querySelectorAll('.network-node svg').length===8&&document.querySelectorAll('#pricing .price-card').length===3);
              if(ready)break; await page.waitForTimeout(5000);
            }
            const d=await inspect(page); await page.screenshot({path:'serphic-desktop.png',fullPage:true});
            add('Latest parity build loaded',ready,{pricing:d.pricingCards,icons:d.heroSvgs,final:d.finalCard?.borderRadius},'3 / 8 / 28px');
            add('No desktop overflow',d.viewport.scrollWidth<=d.viewport.width,d.viewport,'no overflow');
            add('Dark-surface headings stay light',d.darkSurfaceHeadings.every(light),[...new Set(d.darkSurfaceHeadings)],'light headings outside bright CTA');
            add('Pricing remains three cards',d.pricingCards===3&&d.pricingRows===0,{cards:d.pricingCards,rows:d.pricingRows},'3 / 0');
            add('Hero SVG icons restored',d.heroNodes===8&&d.heroSvgs===8,{nodes:d.heroNodes,svgs:d.heroSvgs},'8 / 8');
            add('Hero remains unboxed',d.hero?.borderWidth==='0px'&&d.hero?.backgroundColor==='rgba(0, 0, 0, 0)',d.hero,'unboxed');
            add('Two workspace shells',d.workspaces===2,d.workspaces,2);
            add('Single outer workspace outline',d.workspace?.borderWidth==='1px'&&d.workspace?.borderRadius==='18px'&&d.workspace?.padding==='12px',d.workspace,'1px / 18px / 12px');
            add('No nested workspace frame',d.workspaceBefore?.display==='none'&&d.stage?.borderWidth==='0px',{before:d.workspaceBefore,stage:d.stage},'none / 0px');
            add('Four real workspace panels',d.panels===4,d.panels,4);
            add('Maps grid straight',d.mapTransform==='none'||d.mapTransform==='matrix(1, 0, 0, 1, 0, 0)',d.mapTransform,'none');
            add('90 days + founder structure',d.processRows===5&&d.founderCards===2,{process:d.processRows,founder:d.founderCards},'5 / 2');
            add('Review + focus tabs intact',d.reviewTabs===5&&d.reviewIcon>=1&&d.focusTabs===2,{review:d.reviewTabs,icon:d.reviewIcon,focus:d.focusTabs},'5 / >=1 / 2');
            add('Operating System source proportions',d.systemCards===3&&d.systemCard?.minHeight==='500px'&&d.well?.height==='230px'&&d.system?.backgroundColor==='rgb(9, 12, 13)',{cards:d.systemCards,card:d.systemCard,well:d.well,section:d.system},'3 / 500px / 230px / source background');
            add('Evidence shell restored',d.metrics===3&&d.metricsShell?.padding==='12px'&&d.metricsShell?.gap==='12px'&&d.metric?.borderRadius==='14px',{metrics:d.metrics,shell:d.metricsShell,metric:d.metric},'3 / 12px / 12px / 14px');
            add('FAQ divider accordion restored',d.faq===6&&d.faqRow?.borderRadius==='0px',{rows:d.faq,row:d.faqRow},'6 / 0px');
            add('Source final CTA restored',d.finalCard?.borderRadius==='28px'&&d.finalCard?.color==='rgb(6, 16, 15)'&&/linear-gradient/.test(d.finalCard?.backgroundImage||''),d.finalCard,'bright source CTA');
            add('Canonical controls restored',d.button?.borderRadius==='10px'&&parseFloat(d.button?.height||0)>=44,d.button,'10px / >=44px');
            add('Correct body font',/Plus Jakarta Sans/i.test(d.body?.fontFamily||''),d.body?.fontFamily,'Plus Jakarta Sans');
            add('No runtime errors',out.pageErrors.length===0,out.pageErrors,[]);
            await page.setViewportSize({width:390,height:844}); await page.reload({waitUntil:'networkidle'}); await page.waitForTimeout(800);
            const m=await inspect(page); await page.screenshot({path:'serphic-mobile.png',fullPage:true});
            add('No mobile overflow',m.viewport.scrollWidth<=m.viewport.width,m.viewport,'no overflow');
            add('Mobile keeps pricing/workspaces',m.pricingCards===3&&m.workspaces===2,{pricing:m.pricingCards,workspaces:m.workspaces},'3 / 2');
            add('Mobile workspace/final radii',m.workspace?.padding==='10px'&&m.finalCard?.borderRadius==='22px',{workspace:m.workspace?.padding,final:m.finalCard?.borderRadius},'10px / 22px');
            fs.writeFileSync('qa-results.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2)); await browser.close();
            if(out.checks.some(x=>!x.pass))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node qa.cjs
      - name: Upload QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serphic-visual-qa
          path: |
            serphic-desktop.png
            serphic-mobile.png
            qa-results.json
